<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Himalayan Carbon Labs</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="bg-gradient-to-br from-green-950 via-emerald-900 to-teal-950 text-white min-h-screen">

    
    <nav class="p-4 flex justify-between items-center glass shadow-lg">
        <h1 class="text-2xl font-bold text-green-400">🌲 Himalayan Carbon Labs</h1>
        <button onclick="generatePDF()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-semibold transition">Download Report</button>
    </nav>

   
    <main id="dashboard-content" class="p-6 max-w-7xl mx-auto space-y-6">
        
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="glass p-6 rounded-xl text-center">
                <h3 class="text-gray-400 text-sm">Total Area Mapped</h3>
                <p class="text-3xl font-bold text-white mt-2">100 Hectares</p>
            </div>
            <div class="glass p-6 rounded-xl text-center">
                <h3 class="text-gray-400 text-sm">Carbon Credits Generated</h3>
                <p id="credit-display" class="text-3xl font-bold text-green-400 mt-2">500 tCO2e</p>
            </div>
            <div class="glass p-6 rounded-xl text-center">
                <h3 class="text-gray-400 text-sm">Estimated Revenue</h3>
                <p class="text-3xl font-bold text-yellow-400 mt-2">$5,000</p>
            </div>
        </div>

        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass p-4 rounded-xl h-[400px]">
                <h3 class="text-lg font-semibold mb-2">Pilot Area (Uttarkashi)</h3>
                <div id="map" class="w-full h-[320px] rounded-lg z-0"></div>
            </div>
            <div class="glass p-4 rounded-xl h-[400px] flex flex-col justify-center items-center">
                <h3 class="text-lg font-semibold mb-2">Carbon Distribution</h3>
                <canvas id="carbonChart" class="w-full max-w-[300px]"></canvas>
            </div>
        </div>

        
        <div class="glass p-6 rounded-xl flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h3 class="text-xl font-semibold text-green-300">Carbon Estimator</h3>
                <p class="text-sm text-gray-400">Enter land area to calculate potential credits.</p>
            </div>
            <div class="flex gap-4">
                <input type="number" id="hectares" placeholder="Enter Hectares" class="px-4 py-2 rounded-lg text-black outline-none">
                <button onclick="calculateCarbon()" class="bg-green-600 px-6 py-2 rounded-lg font-bold hover:bg-green-700">Calculate</button>
            </div>
        </div>
    </main>

   
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    
    <script src="map-chart.js"></script>
    <script src="calculator-report.js"></script>
</body>
</html>
